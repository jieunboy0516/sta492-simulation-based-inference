<script>
(() => {
  const data = JSON.parse(document.getElementById('sir-frames').textContent);
  const recordedFrames = Uint8Array.from(atob(data.frames), c => c.charCodeAt(0));
  const colors = ['#E6E6E3', '#C44E28', '#33658A', '#DCAA40'];
  const side = data.side;
  const cell = 12;
  const area = side * side;
  const lastStep = data.visits.at(-1);

  // Hold the archived outbreak's random draws fixed across parameter changes.
  function replayDraws() {
    let state = BigInt(data.rngState);
    const increment = BigInt(data.rngInc);
    const multiplier = 47026247687942121848144207491837523525n;
    const draws = new Float64Array(lastStep * 2 * area);
    for (let i = 0; i < draws.length; i++) {
      state = BigInt.asUintN(128, state * multiplier + increment);
      const bits = BigInt.asUintN(64, state ^ (state >> 64n));
      const rotation = state >> 122n;
      const word = BigInt.asUintN(64, (bits >> rotation) | (bits << (64n - rotation)));
      draws[i] = Number(word >> 11n) / 2 ** 53;
    }
    return draws;
  }

  const draws = replayDraws();
  function simulate(p, q, latentSteps = data.latentSteps) {
    const movie = new Uint8Array((lastStep + 1) * area);
    const exposureRemaining = new Uint8Array(area);
    movie.set(recordedFrames.subarray(0, area)); // Shared initial condition
    const hazard = Array.from({length: 5}, (_, k) => 1 - (1 - p) ** k);
    for (let t = 0; t < lastStep; t++) {
      const previous = movie.subarray(t * area, (t + 1) * area);
      const next = movie.subarray((t + 1) * area, (t + 2) * area);
      const drawOffset = t * 2 * area;
      for (let i = 0; i < area; i++) {
        let state = previous[i];
        if (state === 0) {
          const col = i % side;
          const neighbors = Number(col > 0 && previous[i-1] === 1)
            + Number(col < side-1 && previous[i+1] === 1)
            + Number(previous[i-side] === 1) + Number(previous[i+side] === 1);
          if (draws[drawOffset + i] < hazard[neighbors]) {
            state = latentSteps > 0 ? 3 : 1;
            exposureRemaining[i] = latentSteps;
          }
        } else if (state === 1 && draws[drawOffset + area + i] < q) {
          state = 2;
        } else if (state === 3 && --exposureRemaining[i] === 0) {
          state = 1;
        }
        next[i] = state;
      }
    }
    return movie;
  }

  function draw(canvas, frames, step, observed) {
    canvas.width = canvas.height = side * cell;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const counts = [0, 0, 0, 0];
    for (let i = 0; i < side * side; ++i) {
      const state = step == null ? 0 : frames[step * side * side + i];
      counts[state]++;
      ctx.fillStyle = observed && (state !== 1 || step == null) ? '#E6E6E3' : colors[state];
      ctx.fillRect((i % side) * cell, Math.floor(i / side) * cell, cell - 1, cell - 1);
    }
    canvas.setAttribute('aria-label', step == null ? 'No visit recorded yet' :
      'Step '+step+', '+counts[1]+' infectious'+(observed ? ' people recorded' :
      ', '+counts[0]+' susceptible, '+counts[3]+' exposed, '+counts[2]+' recovered'));
    return counts;
  }

  function createPlayer(prefix) {
    const get = name => document.getElementById(prefix + '-' + name);
    const slider = get('time');
    const clock = get('clock');
    const play = get('play');
    const states = get('states');
    const observed = get('visit');
    const stateCaption = get('state-caption');
    const visitCaption = get('visit-caption');
    let frames = recordedFrames;
    let timer;

    function update() {
      const step = Number(slider.value);
      const visit = data.visits.filter(t => t <= step).at(-1);
      clock.value = step;
      const current = draw(states, frames, step, false);
      const observedCounts = draw(observed, frames, visit, true);
      visitCaption.textContent = visit == null ? 'First visit at step ' + data.visits[0] :
        'Last observation · step ' + visit;
      if (stateCaption) {
        stateCaption.textContent = 'Simulated states · ' + current[3] + ' exposed';
        if (visit != null) visitCaption.textContent = 'Visit at step ' + visit + ' · ' + observedCounts[1] + ' infectious';
      }
    }
    function pause() {
      clearInterval(timer);
      timer = undefined;
      play.textContent = 'Play';
    }
    play.addEventListener('click', () => {
      if (timer !== undefined) {
        pause();
        return;
      }
      if (Number(slider.value) === lastStep) slider.value = 0;
      update();
      play.textContent = 'Pause';
      timer = setInterval(() => {
        slider.stepUp();
        update();
        if (Number(slider.value) === lastStep) pause();
      }, 350);
    });
    slider.addEventListener('input', () => { pause(); update(); });
    const slide = slider.closest('section');
    new MutationObserver(() => {
      if (!slide.classList.contains('present')) pause();
    }).observe(slide, {attributes: true, attributeFilter: ['class']});
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

    return function showRun(movie, resetTime = false) {
      pause();
      frames = movie;
      if (resetTime) slider.value = slider.defaultValue;
      update();
    };
  }

  const showParameters = createPlayer('sir');
  const transmission = document.getElementById('sir-p');
  const recovery = document.getElementById('sir-q');
  function updateParameters(reset = false) {
    if (reset) {
      transmission.value = data.theta[0];
      recovery.value = data.theta[1];
    }
    const p = Number(transmission.value);
    const q = Number(recovery.value);
    document.getElementById('sir-p-value').value = p.toFixed(3);
    document.getElementById('sir-q-value').value = q.toFixed(3);
    showParameters(reset ? recordedFrames : simulate(p, q), reset);
  }
  transmission.addEventListener('input', () => updateParameters());
  recovery.addEventListener('input', () => updateParameters());
  document.getElementById('sir-reset').addEventListener('click', () => updateParameters(true));
  updateParameters(true);

  const showOnset = createPlayer('delay');
  const onset = document.getElementById('delay-onset');
  const immediateFrames = simulate(...data.theta, 0);
  onset.addEventListener('change', () => {
    showOnset(Number(onset.value) === 0 ? immediateFrames : recordedFrames);
  });
  function resetOnset() {
    onset.value = String(data.latentSteps);
    showOnset(recordedFrames, true);
  }
  document.getElementById('delay-reset').addEventListener('click', resetOnset);
  resetOnset();
  for (const canvas of document.querySelectorAll('canvas[data-sir-visit]')) {
    draw(canvas, recordedFrames, Number(canvas.dataset.sirVisit), true);
  }
})();
</script>
